version: "3.9"

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: music-bot-lavalink
    restart: unless-stopped
    environment:
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-logs:/opt/Lavalink/logs
    expose:
      - "2333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2333/version"]
      interval: 15s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: music-bot
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the compose network the bot reaches Lavalink by service name.
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

volumes:
  lavalink-logs:
